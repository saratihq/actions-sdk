# Auto-publish @sarati/actions-sdk to npm.
#   • push/merge to `main`  → semantic-release cuts a STABLE version from the
#     feat:/fix: commits (git tag + GitHub release w/ notes + npm @latest).
#   • every push to `main`  → a CANARY build `0.0.0-canary.<sha>` under the @canary
#     dist-tag, so bleeding-edge is installable (`pnpm add @sarati/actions-sdk@canary`)
#     before it's promoted to stable.
#   • push to `next`        → semantic-release prereleases under @next.
#
# Auth: fully tokenless via npm Trusted Publishing (OIDC) — no NPM_TOKEN. Requires
# `id-token: write` on each publishing job + a trusted publisher registered on npm for
# this repo/release.yml, and npm >= 11.5.1 (Node 24). Do NOT set registry-url on
# setup-node — it plants an .npmrc that breaks the OIDC handshake. Provenance is signed
# automatically.
#
# Nothing here ever pushes a commit to `main`: the version lives in the git tag (package.json
# keeps a `0.0.0-semantically-released` sentinel) and CHANGELOG.md is generated at release
# time into the npm tarball only. That keeps `main` fully PR-gated with no bypass actor —
# GitHub cannot grant the Actions bot a ruleset bypass on a repo-level ruleset.
name: release

on:
  push:
    branches: [main, next]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: stable release (semantic-release)
    runs-on: ubuntu-latest
    permissions:
      contents: write # git tag + GitHub release (no commits are pushed to main)
      issues: write
      pull-requests: write
      id-token: write # OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  canary:
    name: canary build (@canary, every push)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm version "0.0.0-canary.$(git rev-parse --short HEAD)" --no-git-tag-version
      - run: npm publish --tag canary --access public
